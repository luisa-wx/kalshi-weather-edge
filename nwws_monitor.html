<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WX SNIPER — v2 Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:'SF Mono',Monaco,'Cascadia Code',monospace; font-size:13px; }
.header { padding:12px 20px; border-bottom:1px solid #21262d; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:20px; color:#f0f6fc; letter-spacing:2px; }
.header h1 span { color:#58a6ff; font-size:12px; font-weight:400; margin-left:8px; }
.status-bar { display:flex; gap:16px; align-items:center; font-size:12px; }
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.dot-green { background:#3fb950; }
.dot-red { background:#f85149; }
.dot-yellow { background:#d29922; }
.mode-live { color:#f85149; font-weight:bold; }
.mode-dry { color:#d29922; }
.tabs { display:flex; gap:2px; padding:8px 20px; border-bottom:1px solid #21262d; }
.tab { padding:6px 16px; cursor:pointer; border-radius:6px 6px 0 0; color:#8b949e; }
.tab.active { background:#161b22; color:#58a6ff; border:1px solid #21262d; border-bottom:1px solid #161b22; }
.tab .badge { background:#30363d; color:#c9d1d9; padding:1px 6px; border-radius:10px; font-size:11px; margin-left:4px; }
.tab.active .badge { background:#1f6feb; color:#fff; }

.panel { display:none; padding:16px 20px; }
.panel.active { display:block; }

/* --- Brackets panel --- */
.station-group { margin-bottom:20px; }
.station-header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#161b22; border:1px solid #21262d; border-radius:6px 6px 0 0; cursor:pointer; }
.station-header:hover { background:#1c2128; }
.station-header h3 { font-size:14px; color:#f0f6fc; }
.station-header .city { color:#8b949e; font-weight:400; }
.station-header .cli-temp { margin-left:auto; }
.station-header .cli-temp .val { font-size:16px; font-weight:bold; }
.station-header .cli-temp .high { color:#f97583; }
.station-header .cli-temp .low { color:#79c0ff; }

table { width:100%; border-collapse:collapse; table-layout:fixed; }
th { text-align:left; padding:4px 8px; color:#8b949e; font-size:11px; font-weight:500; text-transform:uppercase; border-bottom:1px solid #21262d; }
td { padding:5px 8px; border-bottom:1px solid #161b22; overflow:hidden; text-overflow:ellipsis; }
tr:hover { background:#161b22; }
th:nth-child(1), td:nth-child(1) { width:35%; }
th:nth-child(2), td:nth-child(2) { width:12%; text-align:right; }
th:nth-child(3), td:nth-child(3) { width:12%; text-align:right; }
th:nth-child(4), td:nth-child(4) { width:14%; text-align:right; }
th:nth-child(5), td:nth-child(5) { width:14%; text-align:right; }
th:nth-child(6), td:nth-child(6) { width:13%; text-align:center; }

.price { font-weight:bold; }
.price-hot { color:#f97583; }  /* below 98 */
.price-warm { color:#d29922; } /* 98 */
.price-cold { color:#3fb950; } /* 99+ */

.status-locked { color:#3fb950; font-weight:bold; }
.status-dead { color:#f85149; }
.status-open { color:#8b949e; }
.status-traded { color:#d29922; font-weight:bold; }

/* --- Opportunities panel --- */
.opp-card { background:#161b22; border:1px solid #1f6feb; border-radius:8px; padding:12px 16px; margin-bottom:10px; }
.opp-card.snipe { border-color:#3fb950; }
.opp-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.opp-action { font-weight:bold; font-size:14px; }
.opp-action.buy-yes { color:#3fb950; }
.opp-action.buy-no { color:#f97583; }
.opp-edge { font-size:18px; font-weight:bold; color:#d29922; }
.opp-detail { color:#8b949e; font-size:12px; }

/* --- Products panel --- */
.product-row { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid #161b22; align-items:center; }
.product-row.watched { background:#161b22; border-left:3px solid #1f6feb; padding-left:9px; }
.product-time { color:#8b949e; min-width:85px; }
.product-badge { padding:2px 8px; border-radius:4px; font-size:11px; font-weight:bold; min-width:36px; text-align:center; }
.badge-cli { background:#1f6feb; color:#fff; }
.badge-dsm { background:#238636; color:#fff; }
.product-station { font-weight:bold; color:#f0f6fc; min-width:50px; }
.product-city { color:#8b949e; min-width:120px; }
.product-temp .high { color:#f97583; font-weight:bold; }
.product-temp .low { color:#79c0ff; font-weight:bold; }

/* --- Snipe log --- */
.snipe-row { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #161b22; align-items:center; }
.snipe-action { font-weight:bold; padding:2px 8px; border-radius:4px; font-size:11px; }
.snipe-buy-yes { background:#238636; color:#fff; }
.snipe-buy-no { background:#da3633; color:#fff; }
.snipe-success { color:#3fb950; }
.snipe-fail { color:#f85149; }

.empty-state { text-align:center; padding:40px; color:#484f58; }

/* Collapsible */
.collapsible-body { display:none; border:1px solid #21262d; border-top:none; border-radius:0 0 6px 6px; }
.station-group.open .collapsible-body { display:block; }
.station-group.open .station-header { border-radius:6px 6px 0 0; }
</style>
</head>
<body>

<div class="header">
    <h1>WX SNIPER <span>NWWS-OI v2</span></h1>
    <div class="status-bar">
        <div id="connStatus"><span class="status-dot dot-red"></span> Connecting...</div>
        <div id="modeDisplay" class="mode-dry">DRY RUN</div>
        <div id="bracketCount">0 brackets</div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" data-panel="brackets">BRACKETS <span class="badge" id="bracketBadge">0</span></div>
    <div class="tab" data-panel="opportunities">OPPORTUNITIES <span class="badge" id="oppBadge">0</span></div>
    <div class="tab" data-panel="products">PRODUCTS <span class="badge" id="productBadge">0</span></div>
    <div class="tab" data-panel="snipes">SNIPES <span class="badge" id="snipeBadge">0</span></div>
</div>

<div class="panel active" id="panel-brackets"></div>
<div class="panel" id="panel-opportunities"></div>
<div class="panel" id="panel-products"></div>
<div class="panel" id="panel-snipes"></div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let ws = null;
let brackets = [];
let products = [];
let opportunities = [];
let snipes = [];
let cliData = {};  // station -> {high, low, high_time, low_time}

const WS_URL = `ws://${location.hostname}:8766`;

// Station config (matches stations.py)
const STATIONS = {
    KNYC:{city:"NYC"}, KPHL:{city:"Philadelphia"}, KMDW:{city:"Chicago"},
    KLAX:{city:"Los Angeles"}, KMIA:{city:"Miami"}, KAUS:{city:"Austin"},
    KDEN:{city:"Denver"}, KSFO:{city:"San Francisco"}, KSEA:{city:"Seattle"},
    KDCA:{city:"Washington DC"}, KMSY:{city:"New Orleans"}, KLAS:{city:"Las Vegas"},
    KDFW:{city:"Dallas"}, KHOU:{city:"Houston"}, KBOS:{city:"Boston"},
    KMSP:{city:"Minneapolis"}, KSAT:{city:"San Antonio"}, KOKC:{city:"Oklahoma City"},
    KPHX:{city:"Phoenix"},
};

// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
});

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------
function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        document.getElementById('connStatus').innerHTML = '<span class="status-dot dot-green"></span> Connected';
    };

    ws.onclose = () => {
        document.getElementById('connStatus').innerHTML = '<span class="status-dot dot-red"></span> Disconnected';
        setTimeout(connect, 3000);
    };

    ws.onerror = () => {
        document.getElementById('connStatus').innerHTML = '<span class="status-dot dot-red"></span> Error';
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'init') {
            brackets = msg.brackets || [];
            products = msg.products || [];
            opportunities = msg.opportunities || [];
            snipes = msg.snipes || [];

            // Restore CLI data per station from server
            if (msg.cliData) {
                cliData = msg.cliData;
            } else {
                // Rebuild from products
                cliData = {};
                for (const p of products) {
                    if (p.watched && p.station) {
                        cliData[p.station] = {
                            high: p.high,
                            low: p.low,
                            high_time: p.high_time,
                            low_time: p.low_time,
                            product_type: p.product_type,
                            valid_as: p.valid_as,
                            timestamp: p.timestamp,
                        };
                    }
                }
            }

            if (msg.live_mode) {
                document.getElementById('modeDisplay').className = 'mode-live';
                document.getElementById('modeDisplay').textContent = '🔴 LIVE';
            }
            document.getElementById('bracketCount').textContent = msg.bracket_count + ' brackets';

            renderAll();

        } else if (msg.type === 'product') {
            const p = msg.data;
            products.push(p);
            if (p.watched && p.station && p.high !== null) {
                cliData[p.station] = {
                    high: p.high, low: p.low,
                    high_time: p.high_time, low_time: p.low_time,
                    product_type: p.product_type,
                };
            }
            renderProducts();
            renderBrackets();  // re-render to show CLI temps
            updateBadges();

        } else if (msg.type === 'opportunities') {
            for (const o of (msg.opportunities || [])) {
                o.station = msg.station;
                o.cli_high = msg.cli_high;
                o.cli_low = msg.cli_low;
                o.time = new Date().toLocaleTimeString();
                opportunities.push(o);
            }
            renderOpportunities();
            updateBadges();
            // Flash the opportunities tab
            document.querySelector('[data-panel="opportunities"]').style.background = '#1f6feb33';
            setTimeout(() => {
                document.querySelector('[data-panel="opportunities"]').style.background = '';
            }, 2000);

        } else if (msg.type === 'brackets_updated') {
            brackets = msg.brackets || [];
            renderBrackets();
            updateBadges();
        }
    };
}

// ---------------------------------------------------------------------------
// Render functions
// ---------------------------------------------------------------------------
function renderAll() {
    renderBrackets();
    renderProducts();
    renderOpportunities();
    renderSnipes();
    updateBadges();
}

function updateBadges() {
    document.getElementById('bracketBadge').textContent = brackets.length;
    document.getElementById('oppBadge').textContent = opportunities.length;
    document.getElementById('productBadge').textContent = products.filter(p => p.watched).length;
    document.getElementById('snipeBadge').textContent = snipes.length;
}

function priceClass(price) {
    if (price <= 0) return '';
    if (price < 98) return 'price-hot';
    if (price === 98) return 'price-warm';
    return 'price-cold';
}

function renderBrackets() {
    const panel = document.getElementById('panel-brackets');

    // Group by station
    const byStation = {};
    for (const b of brackets) {
        if (!byStation[b.station]) byStation[b.station] = [];
        byStation[b.station].push(b);
    }

    // Sort stations: ones with CLI data first, then alphabetical by city
    const stationOrder = Object.keys(byStation).sort((a, b) => {
        const aHasCli = cliData[a] ? 1 : 0;
        const bHasCli = cliData[b] ? 1 : 0;
        if (aHasCli !== bHasCli) return bHasCli - aHasCli;
        return (STATIONS[a]?.city || a).localeCompare(STATIONS[b]?.city || b);
    });

    let html = '';
    for (const station of stationOrder) {
        const bkts = byStation[station];
        const city = STATIONS[station]?.city || station;
        const cli = cliData[station];

        const highBrackets = bkts.filter(b => b.signal_type === 'high')
            .sort((a, b) => (a.floor || -999) - (b.floor || -999));
        const lowBrackets = bkts.filter(b => b.signal_type === 'low')
            .sort((a, b) => (a.floor || -999) - (b.floor || -999));

        // Get local info from first bracket for this station
        const firstBracket = bkts[0] || {};
        const localTime = firstBracket.local_time || '';
        const localDate = firstBracket.local_date || '';
        const suffix = firstBracket.suffix || '';

        let cliHtml = '';
        if (cli) {
            cliHtml = `
                <span class="cli-temp">
                    <span class="val high">${cli.high !== null ? cli.high + '°F' : '—'}</span>
                    <span style="color:#484f58"> / </span>
                    <span class="val low">${cli.low !== null ? cli.low + '°F' : '—'}</span>
                    <span style="color:#484f58;font-size:11px;margin-left:6px">${cli.product_type}</span>
                </span>`;
        }

        const isOpen = cli ? ' open' : '';

        html += `<div class="station-group${isOpen}" onclick="this.classList.toggle('open')">
            <div class="station-header">
                <h3>${station} <span class="city">${city}</span>
                    <span style="color:#484f58;font-size:11px;margin-left:8px;">${localDate} ${localTime}</span>
                    <span style="color:#30363d;font-size:10px;margin-left:6px;">${suffix}</span>
                </h3>
                ${cliHtml}
            </div>
            <div class="collapsible-body">`;

        if (highBrackets.length > 0) {
            html += `<table>
                <tr><th colspan="6" style="color:#f97583;padding:6px 8px;">HIGH TEMP</th></tr>
                <tr><th>Bracket</th><th>Floor</th><th>Cap</th><th>YES Ask</th><th>NO Ask</th><th>Status</th></tr>`;
            for (const b of highBrackets) {
                const isLocked = b.status === 'locked';
                const isDead = b.status === 'dead';
                const rowStyle = isLocked ? 'background:#23863622;' : isDead ? 'background:#f8514911;' : '';
                let statusHtml;
                if (b.traded) {
                    statusHtml = '<span class="status-traded">💰 TRADED</span>';
                } else if (isLocked) {
                    statusHtml = '<span class="status-locked">✅ LOCKED</span>';
                } else if (isDead) {
                    statusHtml = '<span class="status-dead">❌ DEAD</span>';
                } else {
                    statusHtml = '<span class="status-open">OPEN</span>';
                }

                html += `<tr style="${rowStyle}">
                    <td>${b.subtitle}</td>
                    <td>${b.floor ?? '—'}</td>
                    <td>${b.cap ?? '—'}</td>
                    <td class="price ${priceClass(b.yes_ask)}">${b.yes_ask}¢</td>
                    <td class="price ${priceClass(b.no_ask)}">${b.no_ask}¢</td>
                    <td>${statusHtml}</td>
                </tr>`;
            }
            html += '</table>';
        }

        if (lowBrackets.length > 0) {
            html += `<table style="margin-top:8px">
                <tr><th colspan="6" style="color:#79c0ff;padding:6px 8px;">LOW TEMP</th></tr>
                <tr><th>Bracket</th><th>Floor</th><th>Cap</th><th>YES Ask</th><th>NO Ask</th><th>Status</th></tr>`;
            for (const b of lowBrackets) {
                const isLocked = b.status === 'locked';
                const isDead = b.status === 'dead';
                const rowStyle = isLocked ? 'background:#1f6feb22;' : isDead ? 'background:#f8514911;' : '';
                let statusHtml;
                if (b.traded) {
                    statusHtml = '<span class="status-traded">💰 TRADED</span>';
                } else if (isLocked) {
                    statusHtml = '<span class="status-locked">✅ LOCKED</span>';
                } else if (isDead) {
                    statusHtml = '<span class="status-dead">❌ DEAD</span>';
                } else {
                    statusHtml = '<span class="status-open">OPEN</span>';
                }
                html += `<tr style="${rowStyle}">
                    <td>${b.subtitle}</td>
                    <td>${b.floor ?? '—'}</td>
                    <td>${b.cap ?? '—'}</td>
                    <td class="price ${priceClass(b.yes_ask)}">${b.yes_ask}¢</td>
                    <td class="price ${priceClass(b.no_ask)}">${b.no_ask}¢</td>
                    <td>${statusHtml}</td>
                </tr>`;
            }
            html += '</table>';
        }

        html += '</div></div>';
    }

    if (!html) html = '<div class="empty-state">Loading brackets...</div>';
    panel.innerHTML = html;
}

function renderProducts() {
    const panel = document.getElementById('panel-products');
    // Only show watched station products
    const watched = products.filter(p => p.watched);

    if (watched.length === 0) {
        panel.innerHTML = '<div class="empty-state">Waiting for CLI/DSM products...</div>';
        return;
    }

    let html = '';
    for (const p of watched.slice().reverse().slice(0, 100)) {
        const ts = p.timestamp ? new Date(p.timestamp).toLocaleTimeString() : '';
        const badgeClass = p.product_type === 'CLI' ? 'badge-cli' : 'badge-dsm';
        html += `<div class="product-row watched">
            <span class="product-time">${ts}</span>
            <span class="product-badge ${badgeClass}">${p.product_type}</span>
            <span class="product-station">${p.station || '?'}</span>
            <span class="product-city">${p.city || ''}</span>
            <span class="product-temp">
                <span class="high">${p.high !== null ? p.high + '°F' : '—'}</span>
                <span style="color:#484f58">@${p.high_time || '?'}</span>
                &nbsp;
                <span class="low">${p.low !== null ? p.low + '°F' : '—'}</span>
                <span style="color:#484f58">@${p.low_time || '?'}</span>
            </span>
        </div>`;
    }
    panel.innerHTML = html;
}

function renderOpportunities() {
    const panel = document.getElementById('panel-opportunities');

    if (opportunities.length === 0) {
        panel.innerHTML = '<div class="empty-state">No opportunities yet.<br>When a CLI drops and a bracket is below 98¢, it will appear here.</div>';
        return;
    }

    let html = '';
    for (const o of opportunities.slice().reverse()) {
        const actionClass = o.action === 'BUY_YES' ? 'buy-yes' : 'buy-no';
        html += `<div class="opp-card">
            <div class="opp-header">
                <span>
                    <span class="opp-action ${actionClass}">${o.action}</span>
                    <span style="margin-left:8px">${o.subtitle}</span>
                    <span style="color:#8b949e;margin-left:8px">${o.station || ''}</span>
                </span>
                <span class="opp-edge">${o.edge_cents}¢ edge</span>
            </div>
            <div class="opp-detail">${o.reason}</div>
            ${o.time ? '<div class="opp-detail" style="margin-top:2px">' + o.time + '</div>' : ''}
        </div>`;
    }
    panel.innerHTML = html;
}

function renderSnipes() {
    const panel = document.getElementById('panel-snipes');

    if (snipes.length === 0) {
        panel.innerHTML = '<div class="empty-state">No snipes executed yet.</div>';
        return;
    }

    let html = '<table><tr><th>Time</th><th>Action</th><th>Station</th><th>Bracket</th><th>Price</th><th>Edge</th><th>Live</th><th>Status</th></tr>';
    for (const s of snipes.slice().reverse()) {
        const ts = s.time ? new Date(s.time).toLocaleTimeString() : '';
        const actionClass = s.action === 'BUY_YES' ? 'snipe-buy-yes' : 'snipe-buy-no';
        const statusClass = s.success ? 'snipe-success' : 'snipe-fail';
        html += `<tr>
            <td>${ts}</td>
            <td><span class="snipe-action ${actionClass}">${s.action}</span></td>
            <td>${s.station}</td>
            <td>${s.subtitle || s.ticker}</td>
            <td>${s.original_ask}¢ → ${s.price}¢</td>
            <td>${s.edge_cents || '?'}¢</td>
            <td>${s.live ? '🔴' : '🧪'}</td>
            <td class="${statusClass}">${s.success ? '✅' : '❌'}</td>
        </tr>`;
    }
    html += '</table>';
    panel.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
connect();
</script>
</body>
</html>
