<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Weather Edge v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .edge-glow { animation: pulse 1.5s infinite; box-shadow: 0 0 20px rgba(239,68,68,0.5); }
        @keyframes pulse { 50% { box-shadow: 0 0 40px rgba(239,68,68,0.8); } }
        .bracket-bar { position: relative; height: 32px; border-radius: 4px; overflow: hidden; }
        .bracket-segment { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; }
        .temp-marker { 
            position: absolute; 
            top: 0; bottom: 0; width: 3px;
            background: white;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            z-index: 10;
        }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1f2937; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="border-b border-gray-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-500">
                    KALSHI WEATHER EDGE
                </h1>
                <p class="text-gray-500 text-xs">v4 • Real-time METAR + Forecasts</p>
            </div>
            <div class="text-right text-sm">
                <div id="lastUpdate" class="text-emerald-400">Loading...</div>
                <div id="dataSource" class="text-gray-600 text-xs"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <!-- City Selector -->
        <div id="cityButtons" class="flex gap-2 mb-4 flex-wrap"></div>
        
        <!-- Legend -->
        <div class="mb-4 p-3 bg-gray-900/50 rounded-lg text-xs flex flex-wrap gap-4 items-center">
            <span class="flex items-center gap-1.5">
                <span class="w-3 h-3 bg-red-600 rounded"></span> DEAD (cannot win)
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-3 h-3 bg-green-500 rounded"></span> LIKELY WINNER
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-3 h-3 bg-yellow-500 rounded"></span> STILL POSSIBLE
            </span>
            <span class="flex items-center gap-1.5">
                <span class="w-3 h-3 bg-gray-600 rounded"></span> SETTLED
            </span>
            <span class="text-red-400 font-semibold ml-2">💰 EDGE = BET NO on dead bracket!</span>
        </div>

        <!-- Alerts -->
        <div id="alerts" class="mb-4 space-y-2 hidden"></div>

        <!-- Main Content -->
        <div id="content" class="space-y-4"></div>
    </main>

    <script>
let currentCity = null;
let allCities = [];

async function init() {
    const r = await fetch('/api/cities');
    allCities = await r.json();
    
    document.getElementById('cityButtons').innerHTML = 
        `<button onclick="load('ALL')" id="btn-ALL" class="btn px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 transition">ALL</button>` +
        allCities.map(c => `
            <button onclick="load('${c.code}')" id="btn-${c.code}" 
                class="btn px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 transition ${c.hasLow ? 'ring-1 ring-blue-500/50' : ''}">
                ${c.code}${c.hasLow ? ' ↕' : ' ↑'}
            </button>
        `).join('');
    
    load('ALL');
    setInterval(() => currentCity && load(currentCity, true), 60000);
}

async function load(code, silent = false) {
    currentCity = code;
    document.querySelectorAll('.btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white');
        b.classList.add('bg-gray-800');
    });
    document.getElementById(`btn-${code}`)?.classList.replace('bg-gray-800', 'bg-emerald-600');
    document.getElementById(`btn-${code}`)?.classList.add('text-white');
    
    if (!silent) {
        document.getElementById('content').innerHTML = `
            <div class="flex items-center justify-center py-20 text-gray-500">
                <svg class="animate-spin h-8 w-8 mr-3" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Loading...
            </div>`;
    }
    
    try {
        code === 'ALL' ? await loadAll() : await loadCity(code);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    } catch(e) {
        console.error(e);
        document.getElementById('content').innerHTML = `
            <div class="text-red-400 text-center py-10">
                Error: ${e.message}
            </div>`;
    }
}

async function loadAll() {
    const data = await (await fetch('/api/summary')).json();
    const edges = data.filter(c => c.totalEdgeCount > 0);
    
    // Alerts
    const alertsEl = document.getElementById('alerts');
    if (edges.length) {
        alertsEl.innerHTML = edges.map(c => `
            <div class="bg-red-900/80 border border-red-500 rounded-lg p-4 edge-glow cursor-pointer" onclick="load('${c.code}')">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-bold text-lg">${c.name}</span>
                        <span class="bg-red-600 text-white px-2 py-0.5 rounded text-xs ml-2">${c.totalEdgeCount} EDGE${c.totalEdgeCount > 1 ? 'S' : ''}</span>
                    </div>
                    <div class="text-right text-sm">
                        <div>High Floor: <span class="text-orange-400 font-mono">${c.observedHighFloor}°F</span></div>
                        ${c.hasLow ? `<div>Low Ceiling: <span class="text-blue-400 font-mono">${c.observedLowCeiling}°F</span></div>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
        alertsEl.classList.remove('hidden');
    } else {
        alertsEl.classList.add('hidden');
    }

    // City grid
    document.getElementById('content').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${data.map(c => `
                <div onclick="load('${c.code}')" 
                     class="bg-gray-900 border ${c.totalEdgeCount > 0 ? 'border-red-500 edge-glow' : 'border-gray-800'} rounded-lg p-4 cursor-pointer hover:bg-gray-800/50 transition">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="font-semibold">${c.name}</div>
                            <div class="text-gray-500 text-xs">${c.localDate}</div>
                        </div>
                        ${c.totalEdgeCount > 0 ? `<span class="bg-red-600 px-2 py-0.5 rounded text-xs font-medium">${c.totalEdgeCount} 💰</span>` : ''}
                    </div>
                    ${c.error ? `<div class="text-red-400 text-sm">${c.error}</div>` : `
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-400">High Floor</span>
                                <span class="text-orange-400 font-mono font-medium">${c.observedHighFloor ?? '?'}°F</span>
                            </div>
                            ${c.hasLow ? `
                                <div class="flex justify-between">
                                    <span class="text-gray-400">Low Ceiling</span>
                                    <span class="text-blue-400 font-mono font-medium">${c.observedLowCeiling ?? '?'}°F</span>
                                </div>
                            ` : ''}
                            ${c.forecast ? `
                                <div class="border-t border-gray-800 pt-2 mt-2">
                                    <div class="flex justify-between text-xs">
                                        <span class="text-gray-500">Forecast</span>
                                        <span class="text-purple-400">${c.forecast.high}°/${c.forecast.low}°</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `}
                </div>
            `).join('')}
        </div>
    `;
}

async function loadCity(code) {
    const d = await (await fetch(`/api/city/${code}`)).json();
    
    // Also fetch forecast if available
    let forecast = null;
    try {
        const forecastRes = await fetch(`/api/forecast/${code}`);
        if (forecastRes.ok) {
            forecast = await forecastRes.json();
        }
    } catch(e) {
        console.log('Forecast not available:', e);
    }
    
    document.getElementById('dataSource').textContent = `Source: ${d.dataSource || '?'}`;
    
    // Collect all edges
    const highEdges = (d.high?.brackets?.filter(b => b.hasYesEdge) || []).map(b => ({...b, type: 'HIGH'}));
    const lowEdges = (d.low?.brackets?.filter(b => b.hasYesEdge) || []).map(b => ({...b, type: 'LOW'}));
    const allEdges = [...highEdges, ...lowEdges];
    
    // Alerts
    const alertsEl = document.getElementById('alerts');
    if (allEdges.length) {
        alertsEl.innerHTML = allEdges.map(b => `
            <div class="bg-red-900/80 border border-red-500 rounded-lg p-4 edge-glow">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="font-bold text-lg">💰 [${b.type}] ${b.subtitle || b.title} — EDGE!</div>
                        <div class="text-gray-300 text-sm mt-1">
                            ${b.type === 'HIGH' 
                                ? `Observed high floor <span class="text-orange-400 font-mono">${d.high.observedFloor}°F</span> already exceeds bracket ceiling <span class="font-mono">${b.high}°F</span>`
                                : `Observed low ceiling <span class="text-blue-400 font-mono">${d.low.observedCeiling}°F</span> already below bracket floor <span class="font-mono">${b.low}°F</span>`
                            }
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-green-400 font-bold text-lg">BUY NO @ ${100 - b.yesPrice}¢</div>
                        <div class="text-gray-400 text-xs">Yes bid: ${b.yesPrice}¢</div>
                    </div>
                </div>
            </div>
        `).join('');
        alertsEl.classList.remove('hidden');
    } else {
        alertsEl.classList.add('hidden');
    }

    // Build the visualization
    const highViz = buildMarketViz(d.high, 'HIGH', d.high?.observedFloor, forecast?.high);
    const lowViz = d.hasLow ? buildMarketViz(d.low, 'LOW', d.low?.observedCeiling, forecast?.low) : '';
    
    document.getElementById('content').innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- HIGH Market -->
            <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
                <div class="bg-gradient-to-r from-orange-900/50 to-transparent px-4 py-3 border-b border-gray-800">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="font-bold text-orange-400">📈 HIGH — ${d.cityName}</h2>
                            <div class="text-gray-500 text-xs">${d.localDate}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold text-orange-400">${d.high?.observedFloor ?? '?'}°F</div>
                            <div class="text-gray-500 text-xs">
                                ${d.high?.sixHourMax ? '6hr max ✓' : 'observed floor'}
                            </div>
                        </div>
                    </div>
                    ${forecast ? `
                        <div class="mt-2 pt-2 border-t border-gray-800/50 flex items-center gap-4 text-sm">
                            <span class="text-gray-500">Forecast:</span>
                            <span class="text-purple-400 font-medium">${forecast.high}°F high</span>
                            ${forecast.source ? `<span class="text-gray-600 text-xs">(${forecast.source})</span>` : ''}
                        </div>
                    ` : ''}
                </div>
                <div class="p-4">
                    ${highViz}
                </div>
            </div>

            ${d.hasLow ? `
            <!-- LOW Market -->
            <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
                <div class="bg-gradient-to-r from-blue-900/50 to-transparent px-4 py-3 border-b border-gray-800">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="font-bold text-blue-400">📉 LOW — ${d.cityName}</h2>
                            <div class="text-gray-500 text-xs">${d.localDate}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold text-blue-400">${d.low?.observedCeiling ?? '?'}°F</div>
                            <div class="text-gray-500 text-xs">
                                ${d.low?.sixHourMin ? '6hr min ✓' : 'observed ceiling'}
                            </div>
                        </div>
                    </div>
                    ${forecast ? `
                        <div class="mt-2 pt-2 border-t border-gray-800/50 flex items-center gap-4 text-sm">
                            <span class="text-gray-500">Forecast:</span>
                            <span class="text-purple-400 font-medium">${forecast.low}°F low</span>
                        </div>
                    ` : ''}
                </div>
                <div class="p-4">
                    ${lowViz}
                </div>
            </div>
            ` : ''}
        </div>

        <!-- Readings Table -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden mt-4">
            <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center">
                <h3 class="font-semibold">Temperature Readings (${d.readingsCount})</h3>
                <span class="text-gray-500 text-xs">${d.dataSource}</span>
            </div>
            <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-orange-900/20 rounded-lg p-3">
                    <div class="text-orange-400 text-xs font-medium mb-1">MAX READING</div>
                    <div class="font-mono">
                        ${d.high?.maxReading 
                            ? `${d.high.maxReading.tempC.toFixed(1)}°C = <span class="text-orange-400 font-bold">${d.high.maxReading.minF}°F</span> @ ${d.high.maxReading.timeLocal}`
                            : 'No data'}
                    </div>
                </div>
                ${d.hasLow ? `
                    <div class="bg-blue-900/20 rounded-lg p-3">
                        <div class="text-blue-400 text-xs font-medium mb-1">MIN READING</div>
                        <div class="font-mono">
                            ${d.low?.minReading 
                                ? `${d.low.minReading.tempC.toFixed(1)}°C = <span class="text-blue-400 font-bold">${d.low.minReading.maxF}°F</span> @ ${d.low.minReading.timeLocal}`
                                : 'No data'}
                        </div>
                    </div>
                ` : ''}
            </div>
            <div class="max-h-64 overflow-y-auto scrollbar-thin">
                <table class="w-full text-sm">
                    <thead class="bg-gray-800 sticky top-0">
                        <tr>
                            <th class="text-left px-4 py-2 text-gray-400 font-medium">Time</th>
                            <th class="text-right px-4 py-2 text-gray-400 font-medium">°C</th>
                            <th class="text-right px-4 py-2 text-gray-400 font-medium">°F</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(d.readings || []).map(r => `
                            <tr class="border-t border-gray-800/50 hover:bg-gray-800/30">
                                <td class="px-4 py-1.5 text-gray-300">${r.timeLocal}</td>
                                <td class="px-4 py-1.5 text-right font-mono text-cyan-400">${r.tempC.toFixed(1)}</td>
                                <td class="px-4 py-1.5 text-right font-mono">${r.tempF}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function buildMarketViz(marketData, type, observed, forecastTemp) {
    if (!marketData?.brackets?.length) {
        return '<div class="text-gray-500 text-center py-4">No market data</div>';
    }
    
    const brackets = marketData.brackets;
    
    // Sort brackets for display (ascending for HIGH, descending for LOW could be done)
    const sortedBrackets = [...brackets].sort((a, b) => {
        const aVal = a.low ?? a.high ?? 0;
        const bVal = b.low ?? b.high ?? 0;
        return aVal - bVal;
    });
    
    return `
        <div class="space-y-2">
            ${sortedBrackets.map(b => {
                // Determine status styling
                let bgColor, borderColor, statusText, textColor;
                
                if (b.status === 'WON') {
                    bgColor = 'bg-green-900/50';
                    borderColor = 'border-green-500';
                    statusText = '✓ WON';
                    textColor = 'text-green-400';
                } else if (b.status === 'LOST') {
                    bgColor = 'bg-gray-800/30';
                    borderColor = 'border-gray-700';
                    statusText = 'LOST';
                    textColor = 'text-gray-500';
                } else if (b.isDead) {
                    bgColor = b.hasYesEdge ? 'bg-red-900/50' : 'bg-red-950/30';
                    borderColor = b.hasYesEdge ? 'border-red-500' : 'border-red-800';
                    statusText = 'DEAD';
                    textColor = 'text-red-400';
                } else if (b.status === 'IN_RANGE') {
                    // For HIGH markets, "LEADING" makes sense - current high is here
                    // For LOW markets, use "CURRENT" since it can still drop further
                    if (b.marketType === 'LOW') {
                        bgColor = 'bg-blue-900/30';
                        borderColor = 'border-blue-600';
                        statusText = '● CURRENT';
                        textColor = 'text-blue-400';
                    } else {
                        bgColor = 'bg-green-900/30';
                        borderColor = 'border-green-600';
                        statusText = '★ LEADING';
                        textColor = 'text-green-400';
                    }
                } else {
                    bgColor = 'bg-gray-800/30';
                    borderColor = 'border-gray-700';
                    statusText = 'POSSIBLE';
                    textColor = 'text-yellow-500';
                }
                
                const edgeClass = b.hasYesEdge ? 'edge-glow' : '';
                const closedLabel = b.isTradeable === false ? ' <span class="text-gray-500">(closed)</span>' : '';
                
                return `
                    <div class="${bgColor} border ${borderColor} rounded-lg p-3 ${edgeClass}">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-medium">${b.subtitle || b.title}${closedLabel}</span>
                                ${b.hasYesEdge ? '<span class="ml-2 bg-red-600 text-white text-xs px-1.5 py-0.5 rounded">💰 EDGE</span>' : ''}
                            </div>
                            <span class="text-xs font-medium ${textColor}">${statusText}</span>
                        </div>
                        <div class="flex justify-between items-center mt-2 text-sm">
                            <div class="flex gap-4 text-gray-400">
                                <span>Yes: <span class="text-white font-mono">${b.yesPrice}¢</span></span>
                                <span>Last: <span class="text-gray-300 font-mono">${b.lastPrice}¢</span></span>
                                <span>Vol: <span class="text-gray-300">${b.volume.toLocaleString()}</span></span>
                            </div>
                            ${b.hasYesEdge ? `
                                <div class="text-green-400 font-semibold">
                                    → BUY NO @ ${100 - b.yesPrice}¢
                                </div>
                            ` : ''}
                        </div>
                        ${b.hasYesEdge ? `
                            <div class="mt-2 pt-2 border-t border-red-800/50 text-xs text-red-300">
                                ⚠️ This bracket is mathematically eliminated. ${type === 'HIGH' 
                                    ? `The high is already ${observed}°F, which exceeds ${b.high}°F.`
                                    : `The low is already ${observed}°F, which is below ${b.low}°F.`
                                }
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

init();
    </script>
</body>
</html>
