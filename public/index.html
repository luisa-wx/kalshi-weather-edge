<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Weather Edge v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .edge-glow { animation: pulse 1.5s infinite; box-shadow: 0 0 20px rgba(239,68,68,0.5); }
        @keyframes pulse { 50% { box-shadow: 0 0 40px rgba(239,68,68,0.8); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between mb-4">
            <div>
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">KALSHI WEATHER EDGE v2</h1>
                <p class="text-gray-500 text-xs">HIGH+LOW | Asymmetric rounding | Aviation API</p>
            </div>
            <div class="text-right text-sm">
                <div id="lastUpdate" class="text-emerald-400">Loading...</div>
                <div id="dataSource" class="text-gray-600 text-xs"></div>
            </div>
        </div>
        <div id="cityButtons" class="flex gap-2 mb-4 flex-wrap"></div>
        <div class="mb-4 p-2 bg-gray-900 rounded text-xs flex flex-wrap gap-3">
            <span><span class="inline-block w-3 h-3 bg-red-600 rounded mr-1"></span>DEAD = Cannot win</span>
            <span><span class="inline-block w-3 h-3 bg-green-600 rounded mr-1"></span>LOCKED/WON = Winner</span>
            <span><span class="inline-block w-3 h-3 bg-yellow-600 rounded mr-1"></span>POSSIBLE = In play</span>
            <span><span class="inline-block w-3 h-3 bg-gray-600 rounded mr-1"></span>LOST = Settled no</span>
            <span class="text-red-400">💰 EDGE = Free money!</span>
        </div>
        <div id="alerts" class="mb-4 hidden"></div>
        <div id="content" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
    </div>
    <script>
let city = null;
async function init() {
    const r = await fetch('/api/cities');
    const cities = await r.json();
    document.getElementById('cityButtons').innerHTML = 
        `<button onclick="load('ALL')" id="btn-ALL" class="btn px-3 py-1 rounded text-sm bg-gray-800">ALL</button>` +
        cities.map(c => `<button onclick="load('${c.code}')" id="btn-${c.code}" 
            class="btn px-3 py-1 rounded text-sm bg-gray-800 ${c.hasLow?'border border-blue-500':''}">${c.code}${c.hasLow?'↕':'↑'}</button>`).join('');
    load('ALL');
    setInterval(() => city && load(city), 60000);
}
async function load(code) {
    city = code;
    document.querySelectorAll('.btn').forEach(b => { b.classList.remove('bg-emerald-600'); b.classList.add('bg-gray-800'); });
    document.getElementById(`btn-${code}`)?.classList.replace('bg-gray-800','bg-emerald-600');
    document.getElementById('content').innerHTML = '<div class="col-span-2 text-center py-20 text-gray-500">Loading...</div>';
    try {
        code === 'ALL' ? await loadAll() : await loadCity(code);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    } catch(e) { document.getElementById('content').innerHTML = `<div class="col-span-2 text-red-400 text-center">${e.message}</div>`; }
}
async function loadAll() {
    const data = await (await fetch('/api/summary')).json();
    const edges = data.filter(c => c.totalEdgeCount > 0);
    document.getElementById('alerts').innerHTML = edges.length ? edges.map(c => 
        `<div class="bg-red-900 border-2 border-red-500 rounded p-3 edge-glow cursor-pointer mb-2" onclick="load('${c.code}')">
            <b>${c.name}: ${c.totalEdgeCount} edge(s)!</b><br><small>High: ${c.observedHighFloor}°F ${c.hasLow?`| Low: ${c.observedLowCeiling}°F`:''}</small>
        </div>`).join('') : '';
    document.getElementById('alerts').classList.toggle('hidden', !edges.length);
    document.getElementById('content').innerHTML = `<div class="col-span-2">
        <h2 class="text-xl font-bold mb-4">All Cities</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${data.map(c => `
            <div onclick="load('${c.code}')" class="bg-gray-900 border ${c.totalEdgeCount>0?'border-red-500 edge-glow':'border-gray-700'} rounded-lg p-4 cursor-pointer hover:bg-gray-800">
                <div class="flex justify-between mb-2"><b>${c.name}</b>${c.totalEdgeCount>0?`<span class="bg-red-600 px-2 rounded text-xs">${c.totalEdgeCount}</span>`:''}</div>
                ${c.error ? `<div class="text-red-400">${c.error}</div>` : `
                <div class="text-gray-400 text-sm">
                    <div>Date: ${c.localDate}</div>
                    <div>High Floor: <span class="text-orange-400">${c.observedHighFloor??'?'}°F</span></div>
                    ${c.hasLow?`<div>Low Ceiling: <span class="text-blue-400">${c.observedLowCeiling??'?'}°F</span></div>`:''}
                </div>`}
            </div>`).join('')}</div></div>`;
}
async function loadCity(code) {
    const d = await (await fetch(`/api/city/${code}`)).json();
    document.getElementById('dataSource').textContent = `Source: ${d.dataSource||'?'}`;
    const edges = [...(d.high?.brackets?.filter(b=>b.hasYesEdge)||[]).map(b=>({...b,t:'HIGH'})),
                   ...(d.low?.brackets?.filter(b=>b.hasYesEdge)||[]).map(b=>({...b,t:'LOW'}))];
    document.getElementById('alerts').innerHTML = edges.length ? edges.map(b => 
        `<div class="bg-red-900 border-2 border-red-500 rounded p-3 edge-glow mb-2">
            <b>💰 [${b.t}] ${b.subtitle||b.title} - EDGE DETECTED!</b><br>
            <small class="text-gray-300">${b.t==='HIGH'?`Observed high floor ${d.high.observedFloor}°F already exceeds bracket ceiling ${b.high}°F`:`Observed low ceiling ${d.low.observedCeiling}°F already below bracket floor ${b.low}°F`}</small>
            <div class="text-green-400 mt-2 font-bold">→ BUY NO @ ${b.noPriceAsk||'?'}¢ (Yes bid: ${b.yesPrice}¢)</div>
        </div>`).join('') : '';
    document.getElementById('alerts').classList.toggle('hidden', !edges.length);
    const renderBrackets = (brackets) => !brackets?.length ? '<div class="text-gray-500">No markets</div>' :
        brackets.map(b => {
            // Determine styling based on status
            let cls, statusLabel;
            if (b.status === 'WON') {
                cls = 'bg-green-900 border-green-500';
                statusLabel = '<span class="bg-green-600 px-2 rounded text-xs">WON ✓</span>';
            } else if (b.status === 'LOST') {
                cls = 'bg-gray-900 border-gray-600 opacity-50';
                statusLabel = '<span class="bg-gray-600 px-2 rounded text-xs">LOST</span>';
            } else if (b.isDead) {
                cls = b.hasYesEdge ? 'bg-red-900 border-red-500 edge-glow' : 'bg-red-950 border-red-700';
                statusLabel = '<span class="bg-red-600 px-2 rounded text-xs">DEAD</span>';
            } else if (b.status === 'IN_RANGE') {
                cls = 'bg-green-900/50 border-green-600';
                statusLabel = '<span class="bg-green-600 px-2 rounded text-xs">LOCKED ✓</span>';
            } else {
                cls = 'bg-gray-800 border-gray-700';
                statusLabel = '<span class="bg-yellow-600 text-black px-2 rounded text-xs">POSSIBLE</span>';
            }
            // Show if market is not tradeable
            const tradeableNote = b.isTradeable === false ? '<span class="text-gray-500 text-xs ml-1">(closed)</span>' : '';
            return `<div class="${cls} border rounded p-2 mb-2">
                <div class="flex justify-between"><span>${b.subtitle||b.title}${b.hasYesEdge?'<span class="bg-red-600 px-1 ml-1 rounded text-xs">💰 EDGE</span>':''}${tradeableNote}</span>
                ${statusLabel}</div>
                <div class="text-gray-500 text-xs mt-1">Yes:${b.yesPrice}¢ Last:${b.lastPrice}¢ Vol:${b.volume}${b.isTradeable===false?' [SETTLED]':''}</div>
                ${b.hasYesEdge?'<div class="text-red-300 text-xs mt-1">⚠️ BET NO @ '+b.noPriceAsk+'¢ - BRACKET CANNOT WIN!</div>':''}
            </div>`;
        }).join('');
    document.getElementById('content').innerHTML = `
        <div class="space-y-4">
            <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                <h2 class="text-lg font-bold text-orange-400 mb-2">📈 HIGH - ${d.cityName}</h2>
                <div class="bg-blue-900/50 border border-blue-500 rounded p-2 mb-3 text-sm flex justify-between"><span>${d.localDate}</span><span class="text-emerald-400">${d.localTime} ${d.tzAbbrev||''}</span></div>
                <div class="bg-orange-900 border-2 border-orange-500 rounded p-3 mb-3">
                    <div class="text-orange-300 text-xs">OBSERVED FLOOR ${d.high?.sixHourMax?'<span class="text-green-400">(6HR MAX ✓)</span>':''}</div>
                    <div class="text-2xl font-bold">${d.high?.observedFloor??'?'}°F</div>
                    ${d.high?.sixHourMax?`<div class="text-xs text-green-400 mt-1">⚡ 6-hour max confirmed - authoritative!</div>`:''}
                </div>
                <div class="max-h-80 overflow-y-auto">${renderBrackets(d.high?.brackets)}</div>
            </div>
            ${d.hasLow?`<div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                <h2 class="text-lg font-bold text-blue-400 mb-2">📉 LOW</h2>
                <div class="bg-blue-900 border-2 border-blue-500 rounded p-3 mb-3">
                    <div class="text-blue-300 text-xs">OBSERVED CEILING ${d.low?.sixHourMin?'<span class="text-green-400">(6HR MIN ✓)</span>':''}</div>
                    <div class="text-2xl font-bold">${d.low?.observedCeiling??'?'}°F</div>
                    ${d.low?.sixHourMin?`<div class="text-xs text-green-400 mt-1">⚡ 6-hour min confirmed - authoritative!</div>`:''}
                </div>
                <div class="max-h-80 overflow-y-auto">${renderBrackets(d.low?.brackets)}</div>
            </div>`:''}
        </div>
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
            <h2 class="text-lg font-bold mb-2">READINGS (${d.readingsCount}) <span class="text-gray-500 text-sm font-normal">~hourly from ${d.dataSource||'?'}</span></h2>
            ${d.high?.maxReading?`<div class="bg-orange-900/50 rounded p-2 mb-2"><small class="text-orange-400">MAX:</small> ${d.high.maxReading.tempC.toFixed(1)}°C = ${d.high.maxReading.minF}°F @ ${d.high.maxReading.timeLocal}</div>`:''}
            ${d.hasLow&&d.low?.minReading?`<div class="bg-blue-900/50 rounded p-2 mb-2"><small class="text-blue-400">MIN:</small> ${d.low.minReading.tempC.toFixed(1)}°C = ${d.low.minReading.maxF}°F @ ${d.low.minReading.timeLocal}</div>`:''}
            <table class="w-full text-sm"><thead><tr class="text-gray-500 border-b border-gray-700"><th class="text-left py-1">Time (${d.tzAbbrev||'local'})</th><th class="text-right">°C</th><th class="text-right">°F</th></tr></thead>
            <tbody>${d.readings?.map(r=>`<tr class="border-b border-gray-800"><td class="text-yellow-400">${r.timeLocal}</td><td class="text-right text-cyan-400">${r.tempC.toFixed(1)}</td><td class="text-right">${r.tempF}</td></tr>`).join('')||'<tr><td colspan="3" class="text-gray-500">No data</td></tr>'}</tbody></table>
        </div>`;
}
init();
    </script>
</body>
</html>
