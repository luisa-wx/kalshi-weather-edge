<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Weather Edge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
        .edge-glow { 
            animation: edgePulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        @keyframes edgePulse {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto p-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">
                    KALSHI WEATHER EDGE
                </h1>
                <p class="text-gray-500 text-xs">Find dead brackets still trading</p>
            </div>
            <div class="text-right">
                <div class="text-gray-500 text-xs">Auto-refresh: 60s</div>
                <div id="lastUpdate" class="text-emerald-400 text-sm">Loading...</div>
            </div>
        </div>

        <!-- City Selector -->
        <div class="flex gap-2 mb-6 flex-wrap">
            <button onclick="loadCity('ALL')" id="btn-ALL" 
                class="city-btn px-3 py-1 rounded text-sm bg-gray-800 hover:bg-gray-700">
                ALL
            </button>
        </div>
        <div id="cityButtons" class="flex gap-2 mb-6 flex-wrap"></div>

        <!-- Alerts Section -->
        <div id="alertsSection" class="mb-6 hidden">
            <h2 class="text-lg font-bold text-red-400 mb-2">🚨 EDGES FOUND</h2>
            <div id="alertsList" class="space-y-2"></div>
        </div>

        <!-- Main Content -->
        <div id="content" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="text-gray-500 text-center py-20">
                Select a city to view data...
            </div>
        </div>
    </div>

    <script>
        let currentCity = null;
        let autoRefreshInterval = null;

        // Load cities and create buttons
        async function init() {
            const response = await fetch('/api/cities');
            const cities = await response.json();
            
            const container = document.getElementById('cityButtons');
            container.innerHTML = cities.map(city => `
                <button onclick="loadCity('${city.code}')" id="btn-${city.code}"
                    class="city-btn px-3 py-1 rounded text-sm bg-gray-800 hover:bg-gray-700">
                    ${city.code}
                </button>
            `).join('');
            
            // Load summary by default
            loadCity('ALL');
            
            // Auto-refresh every 60 seconds
            autoRefreshInterval = setInterval(() => {
                if (currentCity) loadCity(currentCity);
            }, 60000);
        }

        // Load city data
        async function loadCity(code) {
            currentCity = code;
            
            // Update button styles
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-gray-800');
            });
            document.getElementById(`btn-${code}`)?.classList.remove('bg-gray-800');
            document.getElementById(`btn-${code}`)?.classList.add('bg-emerald-600');
            
            document.getElementById('content').innerHTML = `
                <div class="col-span-2 text-gray-500 text-center py-20">
                    Loading ${code}...
                </div>
            `;
            
            try {
                if (code === 'ALL') {
                    await loadSummary();
                } else {
                    await loadCityDetail(code);
                }
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="col-span-2 text-red-400 text-center py-20">
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Load summary of all cities
        async function loadSummary() {
            const response = await fetch('/api/summary');
            const data = await response.json();
            
            // Check for any edges
            const edges = data.filter(c => c.edgeCount > 0);
            if (edges.length > 0) {
                document.getElementById('alertsSection').classList.remove('hidden');
                document.getElementById('alertsList').innerHTML = edges.map(c => `
                    <div class="bg-red-900 border-2 border-red-500 rounded p-3 edge-glow cursor-pointer"
                         onclick="loadCity('${c.code}')">
                        <div class="font-bold">${c.name}: ${c.edgeCount} dead bracket(s) with edge!</div>
                        <div class="text-red-300 text-sm">Observed floor: ${c.observedFloor}°F</div>
                    </div>
                `).join('');
            } else {
                document.getElementById('alertsSection').classList.add('hidden');
            }
            
            document.getElementById('content').innerHTML = `
                <div class="col-span-2">
                    <h2 class="text-xl font-bold mb-4">All Cities Summary</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${data.map(city => `
                            <div onclick="loadCity('${city.code}')" 
                                 class="bg-gray-900 border ${city.edgeCount > 0 ? 'border-red-500 edge-glow' : 'border-gray-700'} rounded-lg p-4 cursor-pointer hover:bg-gray-800">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="font-bold">${city.name}</div>
                                    ${city.edgeCount > 0 ? `
                                        <span class="bg-red-600 text-white px-2 py-0.5 rounded text-xs">
                                            ${city.edgeCount} EDGE${city.edgeCount > 1 ? 'S' : ''}
                                        </span>
                                    ` : ''}
                                </div>
                                ${city.error ? `
                                    <div class="text-red-400 text-sm">${city.error}</div>
                                ` : `
                                    <div class="text-gray-400 text-sm">
                                        <div>Local: ${city.localDate}</div>
                                        <div>Floor: <span class="text-yellow-400">${city.observedFloor !== null ? city.observedFloor + '°F' : 'No data'}</span></div>
                                        <div>Readings: ${city.readingsCount} | Markets: ${city.marketsCount}</div>
                                    </div>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Load detailed city view
        async function loadCityDetail(code) {
            const response = await fetch(`/api/city/${code}`);
            const data = await response.json();
            
            // Check for edges
            if (data.deadBracketsWithEdge?.length > 0) {
                document.getElementById('alertsSection').classList.remove('hidden');
                document.getElementById('alertsList').innerHTML = data.deadBracketsWithEdge.map(b => `
                    <div class="bg-red-900 border-2 border-red-500 rounded p-3 edge-glow">
                        <div class="font-bold">🎯 ${b.subtitle || b.title} is DEAD but trading at ${b.yesPrice}¢!</div>
                        <div class="text-red-300 text-sm">
                            Observed floor (${data.observedFloor}°F) exceeds bracket ceiling (${b.high}°F)
                        </div>
                        <div class="text-white text-sm mt-1">→ BET NO on this bracket</div>
                    </div>
                `).join('');
            } else {
                document.getElementById('alertsSection').classList.add('hidden');
            }
            
            document.getElementById('content').innerHTML = `
                <!-- Left Column: Brackets -->
                <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">KALSHI BRACKETS</h2>
                        <span class="text-gray-500 text-xs">${data.cityName}</span>
                    </div>
                    
                    <div class="bg-blue-900/50 border border-blue-500 rounded p-3 mb-4">
                        <div class="text-blue-300 text-xs">MARKET DATE (LOCAL)</div>
                        <div class="text-white font-bold">${data.localDate}</div>
                        <div class="text-blue-400 text-xs">${data.localTime}</div>
                    </div>
                    
                    <div class="bg-red-900 border-2 border-red-500 rounded p-3 mb-4">
                        <div class="text-red-300 text-xs">OBSERVED FLOOR</div>
                        <div class="text-3xl font-bold text-white">${data.observedFloor !== null ? data.observedFloor + '°F' : 'No data'}</div>
                        <div class="text-red-200 text-xs">Brackets below this are DEAD</div>
                    </div>
                    
                    <div class="space-y-2">
                        ${data.brackets?.length ? data.brackets.map(b => {
                            let bgClass = 'bg-gray-800 border-gray-700';
                            let statusBadge = '';
                            
                            if (b.isDead) {
                                bgClass = 'bg-red-950 border-red-700';
                                if (b.hasEdge) {
                                    bgClass = 'bg-red-900 border-red-500 edge-glow';
                                    statusBadge = `<span class="bg-red-600 text-white px-2 py-0.5 rounded text-xs ml-2">EDGE!</span>`;
                                }
                            } else if (b.status === 'CURRENT') {
                                bgClass = 'bg-yellow-900/50 border-yellow-600';
                            }
                            
                            return `
                                <div class="${bgClass} border rounded p-3">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <span class="font-bold">${b.subtitle || b.title}</span>
                                            ${statusBadge}
                                        </div>
                                        <div class="text-right">
                                            ${b.isDead ? `
                                                <span class="text-red-400 font-bold">DEAD</span>
                                            ` : `
                                                <span class="text-gray-400">${b.status}</span>
                                            `}
                                        </div>
                                    </div>
                                    <div class="flex justify-between text-sm mt-1">
                                        <span class="text-gray-500">Yes: ${b.yesPrice}¢</span>
                                        <span class="text-gray-500">Last: ${b.lastPrice}¢</span>
                                        <span class="text-gray-500">Vol: ${b.volume}</span>
                                    </div>
                                    ${b.hasEdge ? `
                                        <div class="text-red-300 text-xs mt-2">
                                            ⚠️ Dead bracket trading at ${b.yesPrice}¢ - BET NO!
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('') : '<div class="text-gray-500">No markets found</div>'}
                    </div>
                </div>
                
                <!-- Right Column: Readings -->
                <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">TEMPERATURE READINGS</h2>
                        <span class="text-gray-500 text-xs">${data.readingsCount} readings</span>
                    </div>
                    
                    ${data.maxReading ? `
                        <div class="bg-gray-800 rounded p-3 mb-4">
                            <div class="text-gray-500 text-xs">MAX READING</div>
                            <div class="text-2xl font-bold text-yellow-400">
                                ${data.maxReading.tempC.toFixed(1)}°C = ${data.maxReading.minF}°F
                            </div>
                            <div class="text-gray-500 text-xs">at ${data.maxReading.timeLocal} local</div>
                        </div>
                    ` : ''}
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-gray-500 border-b border-gray-700">
                                    <th class="text-left py-2">Local</th>
                                    <th class="text-right py-2">°C</th>
                                    <th class="text-right py-2">Min°F</th>
                                    <th class="text-right py-2">Max°F</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.readings?.map(r => `
                                    <tr class="border-b border-gray-800">
                                        <td class="py-1 text-yellow-400">${r.timeLocal}</td>
                                        <td class="py-1 text-right text-cyan-400">${r.tempC.toFixed(1)}</td>
                                        <td class="py-1 text-right">${r.minF}</td>
                                        <td class="py-1 text-right text-gray-500">${r.maxF}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4" class="text-gray-500 py-4">No readings</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
